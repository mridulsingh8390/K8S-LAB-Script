# ---------------------------------------------------------------------------
# Same Key Vault and workload identity as the rest of this lab - just a
# different secret name, since the PostgreSQL admin password is a separate
# value from the original Azure SQL admin password.
#
# Run this AFTER storing the password in Key Vault:
#   az keyvault secret set --vault-name <KEY-VAULT-NAME> \
#     --name "postgres-admin-password" --value "<a-real-password>"
# (00b-azure-netapp-files.sh does not do this for you - generate and store
# the password yourself before applying this file, since Postgres itself
# isn't created by an Azure control-plane API call the way Azure SQL was.)
# ---------------------------------------------------------------------------
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-kv-spc
  namespace: dev
spec:
  provider: azure
  secretObjects:
    - secretName: postgres-credentials
      type: Opaque
      data:
        - objectName: postgres-admin-password
          key: POSTGRES_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<USER-ASSIGNED-IDENTITY-CLIENT-ID>"   # same identity already used elsewhere in this lab
    keyvaultName: "<KEY-VAULT-NAME>"
    tenantId: "<AZURE-TENANT-ID>"
    objects: |
      array:
        - |
          objectName: postgres-admin-password
          objectType: secret
          objectVersion: ""
