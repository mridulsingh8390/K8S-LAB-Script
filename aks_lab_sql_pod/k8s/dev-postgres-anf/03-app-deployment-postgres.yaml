# ---------------------------------------------------------------------------
# IMPORTANT, READ BEFORE APPLYING THIS FILE:
#
# This patches the SAME Deployment from k8s/dev/04-deployment-service.yaml
# to point at the in-cluster PostgreSQL StatefulSet instead of Azure SQL.
# The connection string format below (Npgsql-style: Host=...;Username=...)
# is correct FOR POSTGRESQL - but the original HelloWorldApp.web sample app
# was built and tested against SQL Server in this lab series. Its actual
# source code (Program.cs, any DbContext/data-access classes) was never
# confirmed to use a Postgres-compatible driver (Npgsql) rather than
# Microsoft.Data.SqlClient. Simply changing the connection string format
# does NOT make a SQL-Server-oriented .NET app start talking to Postgres -
# that requires the app's own code to use a Postgres driver, which is a
# change to the application source, not something fixable from Kubernetes
# manifests alone.
#
# If you own the HelloWorldApp.web source: swap Microsoft.Data.SqlClient /
# the SQL Server EF Core provider for Npgsql / Npgsql.EntityFrameworkCore.PostgreSQL
# in the project, rebuild the image, and push a new tag before this
# Deployment will actually function against Postgres. This file gives you
# the correct Kubernetes-side wiring for that point; it does not change
# app code, which is outside what infrastructure manifests can do.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: dotnet-app-config-postgres
  namespace: dev
data:
  POSTGRES_HOST: "postgres-svc.dev.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "appdb"
  POSTGRES_SSLMODE: "disable"   # in-cluster traffic only; set to "require" if you add TLS to Postgres itself
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-helloworld
  namespace: dev
  labels:
    app: dotnet-helloworld
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-helloworld
  template:
    metadata:
      labels:
        app: dotnet-helloworld
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: dotnet-app-sa
      containers:
        - name: dotnet-helloworld
          image: <ACR_NAME>.azurecr.io/dotnet-helloworld:v1   # rebuild with a Postgres-compatible driver before this works - see warning above
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: dotnet-app-config-postgres
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: dotnet-app-config-postgres
                  key: POSTGRES_PORT
            - name: POSTGRES_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: dotnet-app-config-postgres
                  key: POSTGRES_DATABASE
            - name: POSTGRES_USERNAME
              value: "postgresadmin"   # matches POSTGRES_USER in 02-statefulset.yaml; not a secret by itself, paired with the real password below
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # Npgsql connection string format - genuinely different syntax
            # from the SQL Server format used elsewhere in this lab series
            # (key=value pairs, semicolon-separated, but different key
            # names: Host/Username/Database, not Server/User ID/Initial Catalog).
            - name: ConnectionStrings__Default
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DATABASE);Username=$(POSTGRES_USERNAME);Password=$(POSTGRES_PASSWORD);SSL Mode=Disable;"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-helloworld-svc
  namespace: dev
  labels:
    app: dotnet-helloworld
spec:
  type: ClusterIP
  selector:
    app: dotnet-helloworld
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
