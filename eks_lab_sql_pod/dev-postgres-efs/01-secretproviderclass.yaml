# ---------------------------------------------------------------------------
# Same Secrets Manager + IRSA setup as the rest of this lab - just a
# different secret, since the PostgreSQL admin password is a separate
# value from the original RDS admin password.
#
# Run this AFTER storing the password in Secrets Manager:
#   aws secretsmanager create-secret --name eks-lab/postgres-admin-password \
#     --secret-string "<a-real-password>" --region <region>
# (00b-aws-efs.sh does not do this for you - generate and store the
# password yourself before applying this file, since Postgres itself isn't
# created by an AWS control-plane API call the way RDS was.)
# ---------------------------------------------------------------------------
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-secrets-spc
  namespace: dev
spec:
  provider: aws
  parameters:
    usePodIdentity: "false"
    objects: |
      - objectName: "<POSTGRES-SECRET-ARN>"
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "postgres-password"
  secretObjects:
    - secretName: postgres-credentials
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
