# ---------------------------------------------------------------------------
# Additional ConfigMap entries needed by the init container and the
# TLS-aware app Deployment. Applied alongside the existing dotnet-app-config
# from k8s/dev/03-configmap.yaml, not replacing it.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-tls-app-config
  namespace: dev
data:
  KV_NAME: "<KEY-VAULT-NAME>"           # e.g. kv-aks-lab-12345 — the Key Vault created by 00-azure-infra.sh
  POSTGRES_HOST: "postgres-svc.dev.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "appdb"
  POSTGRES_SSLMODE: "require"           # changed from 'disable' in the non-TLS variant to 'require'
  POSTGRES_SSL_ROOT_CERT: "/etc/postgres-ca/ca.crt"
---
# ---------------------------------------------------------------------------
# Updated app Deployment — same as dev-postgres-anf/03-app-deployment-postgres.yaml
# but with TLS connection parameters added to the connection string.
#
# Same driver-compatibility caveat as the non-TLS variant: this requires
# the app's source code to use Npgsql (not Microsoft.Data.SqlClient).
# See dev-postgres-anf/README.md for the full explanation.
#
# Key difference from the non-TLS variant:
#   - SSL Mode=Require instead of Disable
#   - Root cert mounted from the cert-manager CA secret (postgres-ca-secret)
#     so the app can verify the Postgres server's identity
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-helloworld
  namespace: dev
  labels:
    app: dotnet-helloworld
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-helloworld
  template:
    metadata:
      labels:
        app: dotnet-helloworld
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: dotnet-app-sa
      containers:
        - name: dotnet-helloworld
          image: <ACR_NAME>.azurecr.io/dotnet-helloworld:v1
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-tls-app-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-tls-app-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: postgres-tls-app-config
                  key: POSTGRES_DATABASE
            - name: POSTGRES_USERNAME
              value: "postgresadmin"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_SSL_ROOT_CERT
              valueFrom:
                configMapKeyRef:
                  name: postgres-tls-app-config
                  key: POSTGRES_SSL_ROOT_CERT
            # Npgsql TLS connection string — sslmode=require means the connection
            # is refused if the server doesn't present a valid cert
            - name: ConnectionStrings__Default
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DATABASE);Username=$(POSTGRES_USERNAME);Password=$(POSTGRES_PASSWORD);SSL Mode=Require;Root Certificate=$(POSTGRES_SSL_ROOT_CERT);"
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        # Mount the CA cert so the app can verify the Postgres server's TLS cert
        - name: postgres-ca
          secret:
            secretName: postgres-ca-secret   # generated by cert-manager from 05-postgres-tls-cert.yaml
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-helloworld-svc
  namespace: dev
  labels:
    app: dotnet-helloworld
spec:
  type: ClusterIP
  selector:
    app: dotnet-helloworld
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
