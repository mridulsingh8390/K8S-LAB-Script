# ---------------------------------------------------------------------------
# PostgreSQL running as a StatefulSet (not a Deployment) - same reasoning
# as the AKS lab's variant: a database needs stable identity and storage
# that follows it specifically if the pod is rescheduled, which a
# Deployment's interchangeable replicas don't provide.
#
# This runs a single replica (replicas: 1) - NOT high availability. Real
# production Postgres-in-Kubernetes setups typically use an operator
# (CloudNativePG, Zalando's postgres-operator) for proper replication,
# failover, and backups. This is the minimum needed to demonstrate
# "database runs as a pod with EFS-backed storage."
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dev
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: dotnet-app-sa   # reuses the same IRSA role already set up for Secrets Manager access
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgresadmin"
            - name: POSTGRES_DB
              value: "appdb"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"   # subdirectory, not the mount root - avoids issues with NFS's lost+found directory
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgresadmin"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgresadmin"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data-efs
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: postgres-secrets-spc
---
# Headless Service: gives the StatefulSet pod a stable DNS name
# (postgres-0.postgres-headless.dev.svc.cluster.local) - the correct
# pattern for a stateful single-instance database.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: dev
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: dev
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
