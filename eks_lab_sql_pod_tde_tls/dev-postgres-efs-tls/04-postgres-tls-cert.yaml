# ---------------------------------------------------------------------------
# cert-manager install + self-signed CA + PostgreSQL server TLS certificate
# Same pattern as the AKS variant, adapted for EKS (no Azure-specific pieces).
#
# Apply AFTER cert-manager is running:
#   helm repo add jetstack https://charts.jetstack.io && helm repo update
#   helm install cert-manager jetstack/cert-manager \
#     --namespace cert-manager --create-namespace \
#     --version v1.14.0 --set crds.enabled=true
#   kubectl wait --for=condition=Available deployment --all -n cert-manager --timeout=120s
# ---------------------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: postgres-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-ca
  namespace: dev
spec:
  isCA: true
  commonName: postgres-ca
  secretName: postgres-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: postgres-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres-ca-issuer
  namespace: dev
spec:
  ca:
    secretName: postgres-ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server-cert
  namespace: dev
spec:
  secretName: postgres-tls
  duration: 8760h
  renewBefore: 720h
  commonName: postgres
  dnsNames:
    - postgres-svc
    - postgres-svc.dev
    - postgres-svc.dev.svc
    - postgres-svc.dev.svc.cluster.local
    - postgres-headless
    - postgres-headless.dev
    - postgres-headless.dev.svc.cluster.local
    - "postgres-0.postgres-headless.dev.svc.cluster.local"
  issuerRef:
    name: postgres-ca-issuer
    kind: Issuer
    group: cert-manager.io
