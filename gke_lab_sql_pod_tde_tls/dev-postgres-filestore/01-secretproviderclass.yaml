# ---------------------------------------------------------------------------
# Same GCP Secret Manager + Workload Identity pattern as the main GKE lab.
# Stores each field as a separate secret (GCP provider has no JSON-splitting).
# Run AFTER storing the postgres password:
#   gcloud secrets create gke-lab-postgres-password --replication-policy=automatic
#   echo -n "<password>" | gcloud secrets versions add gke-lab-postgres-password \
#     --data-file=-
# ---------------------------------------------------------------------------
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-gcp-spc
  namespace: dev
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/<PROJECT_ID>/secrets/gke-lab-postgres-password/versions/latest"
        fileName: "postgres-password"
  secretObjects:
    - secretName: postgres-credentials
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
